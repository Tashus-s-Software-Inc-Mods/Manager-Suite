name: Feature request
description: Something a manager should do, or do differently.
labels: [enhancement]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Which mod?
      description: Pick "Not sure which mod" for an idea that would need a new manager.
      options:
        - Manager UI
        - Contract Manager
        - Deal Manager
        - Leader Manager
        - Research Manager
        - Investment Manager
        - Team Schedule Manager
        - Furnish Manager
        - Not sure which mod
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: What you want to happen in game.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: When would it help?
      description: The situation where you missed it. This helps more than a proposed design.
